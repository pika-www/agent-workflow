<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知识证据与复查 · 未明</title><link rel="stylesheet" href="/knowledge-evidence.css"><script defer src="/knowledge-evidence.js"></script></head>
<body><header><a href="/">← 回到聊天</a><h1>知识证据与复查</h1><a href="/library">资料库 ↗</a></header>
<main><div class="toolbar"><label for="space">知识库</label><select id="space"></select><button id="reload" type="button">刷新</button><span id="summary"></span></div><p id="status" role="status">正在读取知识页…</p>
<div class="layout"><nav aria-label="知识页"><label for="filter">找知识页</label><input id="filter" type="search" placeholder="标题或路径"><div id="pages"></div></nav>
<article><h2 id="page-title">选择一篇知识页</h2><p id="page-state" class="muted"></p><details id="page-preview"><summary>查看知识页正文</summary><pre id="page-body"></pre></details><section aria-label="结论的原文依据"><div id="claims"></div></section>
<details id="revision-editor"><summary>修订这篇知识页</summary><form id="revision-form"><label for="revision-body">对照原文修改分支草稿</label><textarea id="revision-body" required maxlength="80000" rows="12"></textarea><p class="muted">保存时备份旧正文；已有标注需重新核对。发布到中央仍走资料库的审核发布流程。</p><button type="submit">保存为分支修订稿</button></form></details>
<details id="claim-editor"><summary>给这页补原文依据</summary><form id="claim-form"><label for="claim-text">知识页里的具体结论（逐字复制）</label><textarea id="claim-text" required maxlength="3000" rows="3"></textarea><label for="claim-kind">结论类型</label><select id="claim-kind"><option value="fact">来源事实</option><option value="inference">整理者推断</option></select><label for="claim-document">对应原文</label><select id="claim-document" required></select><button id="read-document" type="button">查看原文</button><pre id="document-preview" hidden></pre><label for="claim-quote">支持或解释这条结论的原文片段（逐字复制）</label><textarea id="claim-quote" required maxlength="8000" rows="5"></textarea><p class="muted">保存时检查片段是否存在。含义是否支持结论，随后由你核对；推断会保留推断标记。</p><button type="submit">保存待核对标注</button></form></details>
</article></div>
<section class="sources"><h2>原文与复查记录</h2><p class="muted">核对本地归档只检查保存的版本。比对网页正文会读取公开网页；发现变化后保留旧原文，并列出受影响的知识页。</p><div id="documents"></div>
<details><summary>添加原文</summary><form id="document-form"><label for="document-title">原文标题</label><input id="document-title" required maxlength="200"><label for="document-url">公开网址（本地资料可留空）</label><input id="document-url" type="url" maxlength="2000"><label for="document-text">原文正文</label><textarea id="document-text" required maxlength="80000" rows="8"></textarea><button type="submit">保存原文归档</button></form></details></section>
<p class="muted footer">原文匹配、含义核对、版本复查分别记录。待核对标注不会自动批准知识发布。</p></main></body></html>
